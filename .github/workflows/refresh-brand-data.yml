name: Refrescar datos de marca (Meta Ads + 👍 + embeddings)

# Amplía la base de conocimiento de Topito:
#   1. Trae copys de anuncios de Meta Ads (backfill por partes y luego incremental).
#   2. Trae los copys marcados 👍 (Supabase → tuning.json).
#   3. Calcula los embeddings pendientes (para que entren a la búsqueda por parecido).
#   4. Sube a main lo que haya avanzado -- SIEMPRE, aunque algún paso falle o se
#      acabe el tiempo -- y Render despliega solo.
#
# Diseño para que NUNCA se pierda avance:
#   - Cada paso tiene su propio presupuesto de tiempo y no tumba el job si falla.
#   - El progreso del backfill (data/<marca>/.meta-ads-progress.json, sin token) se
#     sube a git, así cada corrida continúa donde se quedó la anterior.
#   - Corre diario: mientras falte backfill avanza cada día; ya al día, cada corrida
#     solo pide lo nuevo y tarda un par de minutos. (Repo público: minutos gratis.)
on:
  schedule:
    - cron: "0 9 * * *" # diario 09:00 UTC (~03:00 hora CDMX)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-brand-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Conteo inicial
        id: before
        run: node scripts/kb-stats.mjs | tee before.txt

      - name: Refrescar anuncios de Meta Ads
        continue-on-error: true
        timeout-minutes: 80
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_MAX_RUNTIME_MS: "600000" # 10 min por invocación; el loop repite hasta 70 min
        run: |
          DEADLINE=$(( $(date +%s) + 70*60 ))
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            echo "=== fetch-meta-ads intento $i ==="
            OUTPUT=$(npm run fetch-meta-ads 2>&1) && STATUS=0 || STATUS=$?
            echo "$OUTPUT" | tail -n 40
            if echo "$OUTPUT" | grep -q "^Listo\."; then echo "Meta Ads al día."; break; fi
            if [ "$STATUS" -ne 0 ]; then echo "Error en esta invocación; se reintenta en 2 min."; WAIT_MIN=2
            else
              WAIT_MIN=$(echo "$OUTPUT" | grep -oE "esperar ~[0-9]+ min" | grep -oE "[0-9]+" | tail -1)
              WAIT_MIN=${WAIT_MIN:-1}
            fi
            LEFT=$(( (DEADLINE - $(date +%s)) / 60 ))
            if [ "$WAIT_MIN" -ge "$LEFT" ]; then echo "No alcanza el tiempo para esperar ${WAIT_MIN} min; se sigue mañana."; break; fi
            echo "Esperando ${WAIT_MIN} min..."; sleep "${WAIT_MIN}m"
          done

      - name: Guardar avance de Meta Ads
        if: always()
        run: |
          bash scripts/commit-data.sh "chore: refresh brand data (Meta Ads) [automated]"

      - name: Traer copys 👍 de Supabase
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run sync-likes

      - name: Recalcular embeddings pendientes
        continue-on-error: true
        timeout-minutes: 45
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMBEDDINGS_MAX_RUNTIME_MS: "900000" # 15 min por invocación
        run: |
          DEADLINE=$(( $(date +%s) + 40*60 ))
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            echo "=== build-embeddings intento $i ==="
            OUTPUT=$(npm run build-embeddings 2>&1) && STATUS=0 || STATUS=$?
            echo "$OUTPUT" | tail -n 30
            if echo "$OUTPUT" | grep -q "^Listo\."; then echo "Embeddings al día."; break; fi
            [ "$STATUS" -ne 0 ] && echo "Error (probablemente cuota de Gemini); se reintenta en 2 min."
            sleep 2m
          done

      - name: Commit y push de lo que haya avanzado
        if: always()
        run: |
          node scripts/kb-stats.mjs | tee after.txt
          echo "## Base de conocimiento de Topito" >> "$GITHUB_STEP_SUMMARY"
          echo "Antes: $(tr '\n' ' ' < before.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Después: $(tr '\n' ' ' < after.txt)" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/commit-data.sh "chore: refresh brand data (Meta Ads + 👍 + embeddings) [automated]"
